
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba MEGA - NOVA MUSIC</title>
<style>
body {
  background:#090b12;
  color:white;
  font-family:Arial,sans-serif;
  padding:25px;
  max-width:500px;
  margin:auto;
}
h1 { color:#8b7cff; }
input,button {
  box-sizing:border-box;
  width:100%;
  padding:13px;
  margin:8px 0;
  border-radius:9px;
}
input { background:#171b29;color:white;border:1px solid #343950; }
button { background:#7965ed;color:white;border:0;font-weight:bold; }
button:disabled { opacity:.5; }
#status { white-space:pre-wrap;color:#bcb5ff;margin-top:20px; }
a { color:#9b8aff;overflow-wrap:anywhere; }
</style>
</head>
<body>

<h1>NOVA MUSIC</h1>
<h2>Prueba de conexión MEGA</h2>

<p>Esta página es solamente para probar una subida pequeña.</p>

<label>Correo de MEGA</label>
<input id="email" type="email" autocomplete="username">

<label>Contraseña de MEGA</label>
<input id="password" type="password" autocomplete="current-password">

<button id="login">Conectar con MEGA</button>

<hr>

<label>Selecciona una canción pequeña (máximo 10 MB)</label>
<input id="song" type="file" accept="audio/*">

<button id="upload" disabled>Subir canción de prueba</button>

<div id="status">Esperando conexión...</div>
<div id="result"></div>

<script type="module">
const status = document.getElementById("status");
const loginBtn = document.getElementById("login");
const uploadBtn = document.getElementById("upload");
const passwordInput = document.getElementById("password");

let storage = null;

loginBtn.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    status.textContent = "Escribe tu correo y contraseña.";
    return;
  }

  loginBtn.disabled = true;
  status.textContent = "Conectando con MEGA...";

  try {
    const { Storage } = await import(
      "https://unpkg.com/megajs@1.3.10/dist/main.browser-es.mjs"
    );

    storage = await new Storage({ email, password }).ready;

    passwordInput.value = "";
    status.textContent = "¡Conexión exitosa con MEGA!";
    uploadBtn.disabled = false;
  } catch (error) {
    storage = null;
    status.textContent = "Error de conexión: " + error.message;
    loginBtn.disabled = false;
  }
});

uploadBtn.addEventListener("click", async () => {
  const selected = document.getElementById("song").files[0];

  if (!storage || !selected) {
    status.textContent = "Conecta MEGA y selecciona una canción.";
    return;
  }

  if (selected.size > 10 * 1024 * 1024) {
    status.textContent = "El archivo debe pesar máximo 10 MB.";
    return;
  }

  uploadBtn.disabled = true;
  status.textContent = "Preparando canción...";

  try {
    const bytes = new Uint8Array(await selected.arrayBuffer());

    const task = storage.upload({
      name: "NOVA-TEST-" + selected.name,
      size: selected.size
    }, bytes);

    task.on("progress", info => {
      const percent = Math.round(
        info.bytesUploaded / info.bytesTotal * 100
      );
      status.textContent = "Subiendo: " + percent + "%";
    });

    const uploaded = await task.complete;
    const link = await uploaded.link();

    status.textContent = "¡Canción subida correctamente!";
    document.getElementById("result").innerHTML =
      '<p>Enlace público:</p><a target="_blank" rel="noopener" href="' +
      link + '">' + link + '</a>';

  } catch (error) {
    status.textContent = "Error al subir: " + error.message;
  } finally {
    uploadBtn.disabled = false;
  }
});
</script>

</body>
</html>
