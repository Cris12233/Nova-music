name: Build NOVA MUSIC Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'audio-metadata.js'
      - 'nova-offline.js'
      - 'config.js'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-33 platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: |
          for file in app.js audio-metadata.js nova-offline.js service-worker.js config.js; do
            node --input-type=module --check < "$file"
          done
          node --check scripts/copy-mobile.mjs

      - name: Copy web app and add Android platform
        run: |
          npm run build:web
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK metadata and signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      # Publish the APK before emulator startup so a slow emulator cannot
      # prevent retrieving the build for device testing.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-music-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Install and launch APK on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            adb shell getprop ro.build.version.release
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.novamusic.app 1
