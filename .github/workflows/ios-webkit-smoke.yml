name: iOS WebKit smoke tests

on:
  pull_request:
    branches: [main]
    paths:
      - "app.js"
      - "tests/ios-webkit-smoke.mjs"
      - ".github/workflows/ios-webkit-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install WebKit browser
        run: npx playwright install --with-deps webkit
      - name: Test mobile navigation and session safeguards
        run: node tests/ios-webkit-smoke.mjs
