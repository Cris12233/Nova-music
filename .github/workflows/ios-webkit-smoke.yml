name: iOS WebKit smoke tests

on:
  push:
    branches: [fix/ios-favorites-navigation]
    paths:
      - "app.js"
      - "tests/ios-webkit-smoke.mjs"
      - ".github/workflows/ios-webkit-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "app.js"
      - "tests/ios-webkit-smoke.mjs"
      - ".github/workflows/ios-webkit-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install WebKit system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-1 libgraphene-1.0-0 libevent-2.1-7t64 libopus0 \
            libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0 \
            libgstreamer-plugins-bad1.0-0 libavif16 libharfbuzz-icu0 \
            libwayland-server0 libmanette-0.2-0 libsecret-1-0 \
            libhyphen0 libgles2 gstreamer1.0-libav
      - name: Install WebKit browser
        run: npx playwright install webkit
      - name: Test mobile navigation and session safeguards
        run: node tests/ios-webkit-smoke.mjs
